name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version '$JAVA_VERSION'."
            exit 1
          fi
          echo "Java version check passed: $JAVA_VERSION >= 17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Confirmation: ./debug.keystore exists."
          else
            echo "Error: Failed to create temporary debug keystore."
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            echo "Found expected APK at $EXPECTED_APK"
          else
            echo "Expected APK not found at $EXPECTED_APK. Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi

          echo "APK verification passed for $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          ASSET_DIR="./release-assets"
          mkdir -p "$ASSET_DIR"
          
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          SANITIZED_REPO=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          
          RUN_NUMBER="${{ github.run_number }}"
          
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare-asset.outputs.asset_filename }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset '$ASSET_PATH' does not exist or is empty."
            exit 1
          fi
          
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"
          TARGET_SHA="${{ github.sha }}"
          
          RELEASE_NOTES="This is an automatically generated debug APK.
          - Built by GitHub Actions (Run #${RUN_NUMBER}, Attempt #${RUN_ATTEMPT}).
          - Source commit SHA: ${TARGET_SHA}
          - Intended for testing purposes.
          - Not a Play Store production release.
          - Signed only with a temporary debug keystore."
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest \
            "$ASSET_PATH#$ASSET_FILENAME"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish-release.outcome }}"
          RUN_NUMBER="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          ASSET_FILENAME="${{ steps.prepare-asset.outputs.asset_filename }}"
          REPO="${{ github.repository }}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            
            {
              echo "### 🚀 Debug APK Released Successfully!"
              echo "- **Release Page URL**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **APK Asset**: \`$ASSET_FILENAME\`"
              echo "- **Download**: The APK can be downloaded directly from the release **Assets** section."
              echo "- **Backup**: The normal GitHub Actions artifact (\`app-debug-apk\`) is also available."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Warning: GitHub Release publishing failed or was skipped, but the APK build and Actions artifact upload succeeded."
            {
              echo "### ⚠️ Debug APK Built Successfully (Release Publishing Failed)"
              echo "- **Status**: The debug APK was built successfully and uploaded as the GitHub Actions artifact named \`app-debug-apk\`."
              echo "- **Warning**: Automatic GitHub Release publishing encountered an error and could not complete."
              echo "- **Action Required**: You can download the APK directly from the **Actions** tab artifacts."
            } >> $GITHUB_STEP_SUMMARY
          fi
